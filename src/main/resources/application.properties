spring.application.name=funpay
logging.level.org.springframework.web=DEBUG

spring.datasource.url=jdbc:postgresql://localhost:5432/funpay_dev
spring.datasource.username=funpay_user
spring.datasource.password=helloworld
spring.datasource.driver-class-name=org.postgresql.Driver

# Automatically creates or updates tables based on your entity class
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# logging.level.org.springframework.orm.jpa=DEBUG
# logging.level.org.springframework.transaction.interceptor=TRACE

# Liquibase Settings
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
logging.level.liquibase=DEBUG
logging.level.org.liquibase=DEBUG

