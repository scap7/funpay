# 1. Target the isolated test database (leaving funpay_dev untouched)
spring.datasource.url=jdbc:postgresql://localhost:5432/funpay_test
spring.datasource.username=funpay_user
spring.datasource.password=helloworld

# 2. Enable Liquibase for tests explicitly
spring.liquibase.enabled=true

# 3. CRITICAL: Wipes and recreates the schema fresh on every test run (Rails db:test:prepare equivalent)
spring.liquibase.drop-first=true
